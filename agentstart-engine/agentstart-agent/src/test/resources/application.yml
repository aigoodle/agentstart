spring:
  datasource:
    url: jdbc:h2:mem:agentagent;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/model-schema.sql
        - classpath:db/knowledge-schema.sql
        - classpath:db/agent-schema.sql
        - classpath:db/memory-schema.sql

spring-agent:
  model:
    encryption-secret: test-secret-agent

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  test-model: ${OLLAMA_TEST_MODEL:llama3.2:latest}

logging:
  level:
    io.aigoodle: INFO
