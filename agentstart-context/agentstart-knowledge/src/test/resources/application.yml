spring:
  datasource:
    url: jdbc:h2:mem:agentknowledge;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/model-schema.sql
        - classpath:db/knowledge-schema.sql

spring-agent:
  model:
    encryption-secret: test-secret-knowledge

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    io.aigoodle: DEBUG
